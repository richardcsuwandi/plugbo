name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not paste API keys, `.env`, or private logs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: Commands, flags, and a minimal example if you have one.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python version, OS, provider/model if relevant (no keys)"
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      placeholder: Traceback, related PR, anything else.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabo"
version = "0.2.0"
description = "AlphaBO: plug-in agentic Bayesian optimization (Sara + lenz)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "gpytorch>=1.11",
    "botorch>=0.10",
    "numpy",
    "scipy",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
bolt = ["huggingface_hub>=0.24", "safetensors>=0.4"]

[project.scripts]
lenz = "lenz.cli:main"
sara = "sara.cli:main"
sara-blind-test = "benchmarks.run_blind_test:main"
sara-viz = "viz.server:main"

[tool.setuptools.packages.find]
include = ["lenz*", "sara*", "benchmarks*", "llm*", "viz*"]

[tool.setuptools.package-data]
viz = ["static/*"]
lenz = ["plugins/*.md"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end tests that fit several GPs (deselect with -m 'not slow')"]
